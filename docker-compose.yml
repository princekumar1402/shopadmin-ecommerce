services:
  mysql:
    image: mysql:8.0
    container_name: cretzo_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret_2026}
      MYSQL_DATABASE: ${DB_NAME:-cretzo_marketplace}
      MYSQL_USER: ${DB_USER:-cretzo_user}
      MYSQL_PASSWORD: ${DB_PASS:-cretzo_secret_2026}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - cretzo_mysql_data:/var/lib/mysql
      - ./backend/database.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cretzo_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-cretzo_marketplace}
      DB_USER: ${DB_USER:-cretzo_user}
      DB_PASS: ${DB_PASS:-cretzo_secret_2026}
      DB_CHARSET: ${DB_CHARSET:-utf8mb4}
      JWT_SECRET: ${JWT_SECRET:-cretzo_jwt_super_secret_key_2026_dev}
    volumes:
      - ./backend:/app
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  cretzo_mysql_data:
    name: cretzo_mysql_data
